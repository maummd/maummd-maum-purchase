<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F5D50">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>물품 구매 관리</title>
<style>
:root{--bg:#F4F5F1;--card:#fff;--ink:#1B2623;--sub:#4E5B56;--line:#D9DED7;--brand:#2F5D50;--brand2:#3E7A69;--soft:#E6F0EC;
--clinic:#3A6894;--center:#2F7A56;--brain:#8A5BA8;--warn:#B5602A;--wbg:#FBEEE2;--bad:#B03A3A;--bbg:#F8E3E3;--ok:#2F7A56;--okbg:#E2F1E8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;
 padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 84px);word-break:keep-all}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid #D3D9D2;border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:13.5px;color:var(--sub);margin:10px 0 4px;font-weight:700}
header{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
header h1{font-size:21px;flex:1;line-height:1.25}
header h1 small{display:block;font-size:13.5px;color:var(--sub);font-weight:400}
.logo{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:18px;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:17px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3{font-size:15px;margin:16px 0 8px;color:var(--brand)}
.muted{color:var(--sub);font-size:14px}
.btn{background:var(--brand);color:#fff;border-radius:12px;padding:11px 16px;font-weight:700;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--brand)}
.btn.sm{padding:7px 12px;font-size:14px}
.btn.danger{background:var(--bbg);color:var(--bad)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center}
.row.w{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bd{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--sub);border:1px solid var(--line);white-space:nowrap}
.bd.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.bd.w{background:var(--wbg);color:var(--warn);border-color:transparent}
.bd.e{background:var(--bbg);color:var(--bad);border-color:transparent}
.site{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px;color:#fff}
.s-clinic{background:var(--clinic)}.s-center{background:var(--center)}.s-brain{background:var(--brain)}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:none}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid #C8CFC7;flex:none;display:grid;place-items:center;font-weight:900;color:#fff;margin-top:1px}
.ck.on{background:var(--ok);border-color:var(--ok)}
.ck.half{background:linear-gradient(90deg,var(--ok) 50%,transparent 50%);border-color:var(--ok)}
.task .t{font-weight:700;font-size:16px}
.tbody{text-align:left;display:block}.edit{font-size:12.5px;opacity:.6}
.ckline{display:block;text-align:left;margin-top:6px;font-size:13.5px;color:var(--ok);background:var(--okbg);border-radius:8px;padding:4px 9px;width:100%}
.task .d{font-size:14px;color:var(--sub)}
.task.done .t{color:var(--sub);text-decoration:line-through}
.alert{font-size:15px;border-radius:12px;padding:11px 13px;margin-bottom:8px}
.alert.w{background:var(--wbg);color:var(--warn)}.alert.e{background:var(--bbg);color:var(--bad)}.alert.ok{background:var(--okbg);color:var(--ok)}
.biz{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.biz b{font-size:18px;letter-spacing:1px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);font-size:14.5px;white-space:nowrap;background:#fff}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stock{display:flex;gap:4px}
.stock button{padding:5px 8px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;background:#fff}
.stock button.on.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok);font-weight:700}
.stock button.on.low{background:var(--wbg);color:var(--warn);border-color:var(--warn);font-weight:700}
.stock button.on.out{background:var(--bbg);color:var(--bad);border-color:var(--bad);font-weight:700}
.ord{padding:11px 0;border-top:1px solid var(--line)}
.ord:first-child{border-top:none}
.ord .h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--sub)}
.ord .n{font-weight:700;margin-top:3px;font-size:16.5px}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum div{background:var(--bg);border-radius:10px;padding:8px 4px}
.sum b{display:block;font-size:19px;color:var(--brand)}
.sum span{font-size:13.5px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{padding:9px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:700;font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:12.5px;color:var(--sub);gap:1px;padding:4px 0;position:relative}
nav button .ic{font-size:22px;line-height:1.2}
nav button.on{color:var(--brand);font-weight:700}
nav .dot[hidden]{display:none}
.lrow{display:flex;gap:10px;align-items:center;width:100%;padding:11px 0;border-top:1px solid var(--line);text-align:left}
.card h2+.lrow{border-top:none}
.ldate{flex:none;width:68px;font-weight:700;font-size:14.5px;color:var(--sub)}.ldate.today{color:#fff;background:var(--warn);border-radius:8px;padding:2px 6px;width:auto}
details summary{cursor:pointer;margin-top:4px}
nav .dot{position:absolute;top:2px;left:55%;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:15}
.modal .sheet{background:#fff;width:100%;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:90vh;overflow:auto}
.modal h3{font-size:16px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:14px 0}
.x{font-size:19px;color:var(--sub);line-height:1;padding:0 4px;margin-left:auto}
.steps li{margin:0 0 8px 18px}
.steps b{color:var(--brand)}
dl dt{font-size:13px;color:var(--sub);margin-top:8px;font-weight:700}
dl dd{white-space:pre-wrap}
.line{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none}
.line .ln{flex:1;min-width:48px;text-align:center;background:var(--bg);border-radius:10px;padding:6px 2px}
.line .ln b{display:block;font-size:17px;color:var(--sub)}.line .ln span{font-size:10.5px;color:var(--sub);line-height:1.2;display:block}
.line .ln.on{background:var(--wbg)}.line .ln.on b{color:var(--warn)}
.line i{color:#B7C0B8;font-style:normal;font-size:13px}
button.alert{border:none;font:inherit;cursor:pointer}
input:disabled{background:#F2F3F0;color:var(--sub)}
.lt-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px 14px;padding:4px 2px;position:sticky;top:0;z-index:5;background:var(--bg)}
.lt-tab{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 10px;border-radius:14px;background:#fff;border:1.5px solid #E3E7E1;font-size:13px;font-weight:700;color:#4E5B56;min-width:66px}
.lt-tab span{font-size:19px;line-height:1.2}.lt-tab.on{background:linear-gradient(135deg,#FF8A3D,#FF5E62);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(255,94,98,.3)}
.lt-period{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:10px;border:1.5px solid #FFE1C7;text-align:center}
.lt-period b{display:block;font-size:18px;color:#1B2623}.lt-period span{font-size:13px;color:#6B7570}
.lt-nav{width:44px;height:44px;border-radius:12px;background:#FFF1E5;color:#E8642C;font-size:28px;font-weight:700;line-height:1}
.lt-days{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:12px;border:1.5px solid #E3E7E1}
.lt-dl{font-size:13.5px;font-weight:700;color:#4E5B56;margin-right:2px}
.lt-day{width:40px;height:40px;border-radius:50%;border:2px dashed #C9CFC8;background:#fff;color:#9AA39E;font-weight:800;font-size:15.5px;transition:transform .1s}
.lt-day:active{transform:scale(.92)}.lt-day.on{border:2px solid #12A36B;background:#12A36B;color:#fff;box-shadow:0 3px 8px rgba(18,163,107,.3)}
.lt-day.sat.on{background:#2F80ED;border-color:#2F80ED;box-shadow:0 3px 8px rgba(47,128,237,.3)}.lt-day.sun.on{background:#EB5757;border-color:#EB5757;box-shadow:0 3px 8px rgba(235,87,87,.3)}
.lt-more summary{font-weight:700;cursor:pointer;color:#2F5D50}.lt-wk{font-size:14px;margin:12px 0 2px;color:#E8642C}
.sg-w{overflow-x:auto;margin:0 0 10px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}.sg{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;font-size:14px;background:#fff;border-radius:14px;overflow:hidden;border:2px solid #1B2623}
.sg th{background:#FFD84D;color:#1B2623;font-weight:800;padding:8px 3px;border-right:1.5px solid #1B2623;border-bottom:2px solid #1B2623;text-align:center;font-size:13.5px}.sg th:last-child,.sg-c:last-child{border-right:none}
.sg th.sat{background:#CFE3FF;color:#1D5FC2}.sg th.sun{background:#FFD3D3;color:#C62828}.sg th.today{background:#FF8A3D;color:#fff}
.sg-c{border-right:1.5px solid #1B2623;vertical-align:middle;text-align:center;padding:9px 4px;height:80px;cursor:pointer;position:relative;background:#fff}.sg-c:active{background:#FFF7EE}
.sg-c.today{box-shadow:inset 0 0 0 3px #FF8A3D}.sg-c.rest{background:repeating-linear-gradient(135deg,#FAFAF8 0 8px,#F1F2EE 8px 16px)}
.sg-m{line-height:1.35;word-break:keep-all;font-weight:600;color:#1B2623}.sg-m b{display:inline-block;margin-left:2px;padding:0 6px;border-radius:99px;background:#FFE7D3;color:#D9541E;font-size:.95em}
.sg-x{font-size:24px;font-weight:900;color:#C3C8C4}.sg-n{font-size:11.5px;color:#8A938E}
.sg-st{position:absolute;top:3px;right:3px;font-size:10.5px;font-weight:700;border-radius:6px;padding:0 5px;background:#D7F5E6;color:#0E7A50}.sg-c.received .sg-st{background:#12A36B;color:#fff}
.sg-c.ordered{background:#F2FFF8}.sg-c.received{background:#E3F8EE}.sg-dot{display:inline-block;width:12px;height:12px;border-radius:4px;border:1.5px solid #1B2623;margin-right:4px;vertical-align:-1px}.sg-dot.plan{background:#fff}.sg-dot.ordered{background:#F2FFF8}.sg-dot.received{background:#E3F8EE}
@media(max-width:520px){.sg{font-size:12px}.sg th{font-size:11.5px;padding:7px 1px;letter-spacing:-.3px}.sg-c{padding:7px 2px;height:70px}.sg-x{font-size:19px}.lt-day{width:36px;height:36px;font-size:14.5px}.lt-tab{min-width:60px;font-size:12px;padding:7px 6px}}
.lt-days{justify-content:space-between}.lt-days .lt-dl{margin-bottom:2px;width:100%}
.lt-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.lt-act{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:12px;border-radius:14px;text-align:left;color:#fff}
.lt-act span{font-size:22px}.lt-act b{font-size:15.5px}.lt-act small{font-size:12.5px;opacity:.9}.lt-act.a1{grid-column:1/-1;background:linear-gradient(135deg,#12A36B,#0E8C8C)}.lt-act.a2{background:linear-gradient(135deg,#FF8A3D,#FF5E62)}.lt-act.a3{background:#fff;color:#1B2623;border:1.5px solid #D9DED7}.lt-act:disabled{background:#F1F2EE;color:#9AA39E}
.sg-m{overflow-wrap:anywhere}
.snd-pre{max-height:150px;overflow:auto;background:#F7F8F5;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px;line-height:1.5;margin:6px 0 10px;white-space:normal}
.snd{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.snd button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px;border-radius:14px;font-weight:700;font-size:13px;color:#1B2623}
.snd button span{font-size:24px;line-height:1.1}.snd button small{font-size:10px;font-weight:500;color:#4E5B56}.snd .s1{background:#E3F8EE}.snd .s2{background:#FEE500}.snd .s3{background:#E3EEFF}.snd .s4{background:#FFF1E5}.snd .s5{background:#F1F2EE}
.att-bar{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.att-b{display:flex;align-items:center;gap:6px;padding:10px;border-radius:12px;font-weight:700;font-size:14px;text-align:left}
.att-b span{font-size:20px}.att-b.a1{background:linear-gradient(135deg,#12A36B,#0E8C8C);color:#fff}.att-b.a2{background:#FFF1E5;color:#C4521C}.att-b.a3{background:#E3F8EE;color:#0E7A50}.att-b.a4{background:#F1F2EE;color:#4E5B56}
</style></head><body>

<div id="modal"></div>

<script>
/* ===================== 물품 구매 관리 =====================
   근거: 「물품 구매 업무 인수인계서 및 체크리스트」 (외래 병원 · 센터 · 브레인)
   결재 라인: 직원 수요 → 중간관리자 검수 → 최종관리자(원장님) 결재 → 구매 담당 결제(결제 방지 키) → 중간관리자 수령 검수 */
const ST=window.MP_STORE;
const SITES={clinic:'외래 병원',center:'센터',brain:'브레인'};
const CYCLES={M1:'월 1회',W1:'주 1회',W2:'주 2회',ASK:'필요 시',REQ:'요청 시',AFTER:'주문 후'};
const VENDORS=['쿠팡','네이버','기타'];
const ROLES={staff:'직원',mid:'중간관리자',final:'최종관리자 (원장님)',buyer:'구매 담당',admin:'관리자'};
const ROLE_DESC={staff:'수요 내기',mid:'수요 · 주문 검수, 수령 검수',final:'최종 결재',buyer:'주문서 작성 · 결제',admin:'구성원 · 설정 관리'};
const STAGE={review:['중간관리자 검수','w'],final:['원장님 결재','w'],pay:['결제 대기','ok'],ship:['배송 중','w'],arrived:['도착 · 수령 검수','w'],done:['검수 완료','ok'],issue:['문제 (누락 · 파손)','e'],reject:['반려','e']};
const REQ_ST={submitted:['검수 대기','w'],accepted:['검수 통과 · 구매 대기','ok'],rejected:['반려','e'],ordered:['주문 진행 중','w'],done:['받음','ok']};
const DEFAULT_BIZ='';
let _n=0;const uid=()=>Date.now().toString(36)+(_n++).toString(36)+Math.random().toString(36).slice(2,5);
const DEFAULT_ROUTINE=()=>[
 ['M1','원장님 및 데스크 간호사 간식 조사·구매'],['M1','센터 치료진 간식 조사·구매'],['M1','브레인 간식 조사·구매'],
 ['W1','외래 병원 사무용품 및 소모품 재고 확인'],['W1','센터 사무용품 및 생활 소모품 재고 확인'],['W1','쌀 재고 확인 및 필요 시 구매'],
 ['W2','레토르트 식품 주문 및 식사 전날 도착 여부 확인'],['ASK','제과제빵 담당에게 제과제빵 재료 필요 여부 문의'],
 ['ASK','외래 병원·센터·브레인 추가 요청 물품 구매'],['AFTER','배송 완료 및 실제 물품 수령 여부 확인']].map(([c,t])=>({id:uid(),cycle:c,text:t}));
const DEFAULT_ITEMS=()=>[
 ['clinic','간식','원장님 간식','M1','널담 베이글, 우유, 두유 위주 구매. 부족하면 수시 구매',false],
 ['clinic','간식','데스크 간호사 간식','M1','간호사분께 필요한 간식을 확인하고 구매 (임의로 고르지 않기)',false],
 ['clinic','사무·소모품','외래 복합기 잉크','W1','복합기에 맞는 잉크 종류 · 모델명 · 호환 여부, 기존 구매 내역 확인 후 구매',true],
 ['clinic','기타','기타 요청 물품','REQ','외래 병원 요청 물품 — 품목 · 규격 · 수량 확인 후 주문',false],
 ['center','간식·식품','치료진 간식','M1','필요한 간식 조사 후 구매. 재고 부족 시 추가 구매',false],
 ['center','간식·식품','쌀','W1','재고 확인 후 구매. 치료진 및 회원분 요청 시 수시 구매',true],
 ['center','간식·식품','레토르트 식품','W2','식사 전날까지 도착하도록 주문',false],

function onData(part){
  for(const k of Object.keys(part)){
    S[k]=part[k];
    if(Array.isArray(part[k]))BASE[k]=Object.fromEntries(part[k].map(x=>[x.id,JSON.stringify(x)]));
    else if(k==='org')BASE.org=part[k]?Object.fromEntries(['name','settings','items','routine','checks','stock'].map(f=>[f,JSON.stringify(part[k][f]??null)])):{};
  }
  if(!S.me||S.me.active===false){if('me' in part){ready=false;view='gone';render()}return}
  ready=true;

function save(){
  if(!ORG)return;
  const errs=e=>{console.error(e);toast('⚠️ 저장하지 못했어요 — 권한 또는 연결을 확인하세요')};
  for(const col of ['requests','orders','surveys','lunch']){const errs=e=>{console.error(e);if(col==='lunch'){LUNCH_ERR=(e&&e.code)||'error';render()}toast('⚠️ 서버에 저장하지 못했어요 — 다시 로그인하면 사라져요')};
    const base=BASE[col]||{},cur=S[col]||[],ids=new Set(cur.map(x=>x.id));
    cur.forEach(x=>{const j=JSON.stringify(x);if(base[x.id]!==j){base[x.id]=j;const {id,...d}=x;ST.put(ORG,col,id,d).catch(errs)}});
    Object.keys(base).forEach(id=>{if(!ids.has(id)){delete base[id];ST.del(ORG,col,id).catch(errs)}});
    BASE[col]=base;
  }
  if(S.org){const patch={};BASE.org=BASE.org||{};['name','settings','items','routine','checks','stock'].forEach(f=>{const j=JSON.stringify(S.org[f]??null);if(BASE.org[f]!==j){BASE.org[f]=j;patch[f]=S.org[f]}});
    if(Object.keys(patch).length)ST.saveOrg(ORG,patch).catch(errs)}
  syncReminders();
}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const won=n=>(Number(n)||0).toLocaleString('ko-KR')+'원';
const DOW='일월화수목금토';
const md=s=>{if(!s)return '-';const d=new Date(String(s).slice(0,10)+'T00:00');if(isNaN(d))return '-';return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2400)}
function weekStart(d=new Date()){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x}
function periodKey(cycle,d=new Date()){if(cycle==='M1')return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;if(cycle==='W1'||cycle==='W2')return 'W'+ymd(weekStart(d));return 'D'+ymd(d)}
function periodLabel(cycle){if(cycle==='M1'){const d=new Date();return `${d.getMonth()+1}월`}if(cycle==='W1'||cycle==='W2'){const s=weekStart(),e=new Date(s);e.setDate(e.getDate()+6);return `${s.getMonth()+1}/${s.getDate()}~${e.getMonth()+1}/${e.getDate()}`}return '오늘'}
const need=c=>c==='W2'?2:1;
function doneCount(id,cycle){const c=CHECKS()[id+'|'+periodKey(cycle)];return c?(c.n||1):0}
const isRegular=c=>['M1','W1','W2'].includes(c);
const stamp=(note)=>({by:AUTH.uid,name:myName(),at:new Date().toISOString(),...(note?{note}:{})});
function logStage(o,st,note){o.log=o.log||[];o.log.push({st,...stamp(note)})}
const lastLog=(o,st)=>(o.log||[]).filter(l=>l.st===st).slice(-1)[0];
const appCard=o=>{const st=SET();if((+o.price||0)>=st.approveItem)return true;if(!o.payGroup)return false;return S.orders.filter(x=>x.date===o.date&&x.payGroup===o.payGroup).reduce((a,x)=>a+(+x.price||0),0)>=st.approveOrder};
const sumP=a=>a.reduce((s,o)=>s+(+o.price||0),0);
const by=st=>S.orders.filter(o=>o.stage===st);

function myQueue(){
  const q=[],t=today();
  if(has('mid')){
    const r=S.requests.filter(x=>x.status==='submitted');if(r.length)q.push({lvl:'w',go:'demand',txt:`📩 수요 검수 ${r.length}건`});
    const o=by('review');if(o.length)q.push({lvl:'w',go:'order',of:'review',txt:`🔎 주문서 검수 ${o.length}건 · ${won(sumP(o))}`});
    const a=S.orders.filter(o=>o.stage==='arrived'||(o.stage==='ship'&&o.eta&&o.eta<=t));if(a.length)q.push({lvl:'w',go:'order',of:'recv',txt:`📦 수령 검수 ${a.length}건`});
  }
  if(has('final')){const o=by('final');if(o.length)q.push({lvl:'w',act:'finalView',txt:`👨‍⚕️ 원장님 결재 ${o.length}건 · ${won(sumP(o))}`})}
  if(has('buyer')){
    const r=S.requests.filter(x=>x.status==='accepted');if(r.length)q.push({lvl:'w',go:'demand',txt:`🧾 검수 통과한 수요 ${r.length}건 — 주문서 작성`});
    const p=by('pay');if(p.length)q.push({lvl:'ok',go:'order',of:'pay',txt:`💳 결재 완료 · 결제할 주문 ${p.length}건 · ${won(sumP(p))}`});
    const rj=by('reject');if(rj.length)q.push({lvl:'e',go:'order',of:'all',txt:`↩️ 반려된 주문서 ${rj.length}건 — 고쳐서 다시 올리기`});
    S.orders.forEach(o=>{
      if(o.stage==='ship'&&o.eta&&o.eta<t)q.push({lvl:'e',go:'order',of:'recv',txt:`⚠️ ${o.name}: 배송 예정일(${md(o.eta)})이 지났어요`});
      if(o.meal&&['ship','pay','final','review'].includes(o.stage)&&(!o.eta||o.eta>=o.meal))q.push({lvl:'e',go:'order',txt:`🍱 ${o.name}: 식사일(${md(o.meal)}) 전날까지 도착하지 않아요`});
    });
  }
  if(has('buyer')||has('mid'))S.orders.filter(o=>o.stage==='issue').forEach(o=>q.push({lvl:'e',go:'order',of:'recv',txt:`⚠️ ${o.name}: ${o.issue||'누락 · 파손'} — 교환 또는 재주문`}));
  return q;
}

function orderRow(o){

  if(o.stage==='review'&&has('mid')){B(`data-midok="${o.id}"`,'✓ 검수 통과');B(`data-reject="${o.id}"`,'반려','danger')}
  if(o.stage==='final'&&has('final')){B(`data-finalok="${o.id}"`,'✓ 결재');B(`data-reject="${o.id}"`,'반려','danger')}
  if(o.stage==='pay'&&has('buyer')){if(o.vendor!=='기타')B(`data-shop="${o.id}"`,`🔒 ${o.vendor||'쿠팡'}에서 결제`);B(`data-paid="${o.id}"`,'🔒 결제 완료 기록',o.vendor!=='기타'?'ghost':'')}
  if(o.stage==='ship'&&(has('buyer')||has('mid')))B(`data-arrived="${o.id}"`,'📦 도착했어요');
  if(['ship','arrived'].includes(o.stage)&&has('mid')){B(`data-inspok="${o.id}"`,'✓ 수령 검수 완료');B(`data-issue="${o.id}"`,'누락 · 파손','danger')}
  if(o.stage==='issue'&&has('buyer')&&!o.reordered)B(`data-reorder="${o.id}"`,'재주문서','ghost');
  if(o.stage==='issue'&&has('mid'))B(`data-inspok="${o.id}"`,'해결 · 검수 완료','ghost');
  if(o.stage==='reject'&&(has('buyer')||has('mid')))B(`data-resubmit="${o.id}"`,'고쳐서 다시 올리기','ghost');
  if(['review','final','reject'].includes(o.stage)&&(has('buyer')||has('mid')))B(`data-edit="${o.id}"`,'고치기','ghost');

  const L1=lastLog(o,'reject');

function signLine(o){const p=[];const a=lastLog(o,'review'),f=lastLog(o,'final'),y=lastLog(o,'pay'),i=lastLog(o,'done');

function monthsBetween(a,b){const out=[];let [y,m]=a.split('-').map(Number);const [y2,m2]=b.split('-').map(Number);while(y<y2||(y===y2&&m<=m2)){out.push(`${y}-${pad(m)}`);m++;if(m>12){m=1;y++}if(out.length>60)break}return out}
let expFrom=null,expTo=null,expDetail=true;
function lunchRows(){const c=LC();if(!c)return [];return S.lunch.filter(d=>d.id.startsWith('d-')&&d.status==='received').map(d=>{const pl=planDay(d.date);return pl?{o:{id:d.id,name:`도시락 (${d.menu})`,site:'center',price:lunchCost(d.date),vendor:c.store,qty:`${pl.count}개`,stage:'done',log:[],lunch:1},day:d.date}:null}).filter(Boolean)}
function spendRows(from,to){return [...S.orders.filter(o=>PAID.includes(o.stage)).map(o=>({o,day:spendDay(o)})),...lunchRows()].filter(x=>x.day.slice(0,7)>=from&&x.day.slice(0,7)<=to).sort((a,b)=>a.day.localeCompare(b.day))}
function expenseCard(){
  const cur=today().slice(0,7);if(!expTo)expTo=cur;if(!expFrom)expFrom=`${cur.slice(0,4)}-01`;
  const ms=monthsBetween(expFrom,expTo),rows=spendRows(expFrom,expTo),tot=rows.reduce((a,x)=>a+(+x.o.price||0),0);
  const by=m=>rows.filter(x=>x.day.startsWith(m));const mx=Math.max(1,...ms.map(m=>by(m).reduce((a,x)=>a+(+x.o.price||0),0)));
  const opts=v=>{const all=[...new Set([cur,...S.orders.map(o=>(o.date||'').slice(0,7)).filter(Boolean)])].sort();const first=all[0]||cur;return monthsBetween(first.slice(0,4)+'-01',cur).reverse().map(m=>`<option value="${m}" ${m===v?'selected':''}>${ym(m)}</option>`).join('')};
  return `<div class="card" style="border-color:var(--brand2)"><h2>📤 월별 지출 내역 출력</h2>
   <div class="two"><div><label class="f">시작 달</label><select id="expFrom">${opts(expFrom)}</select></div><div><label class="f">끝 달</label><select id="expTo">${opts(expTo)}</select></div></div>
   <label class="row" style="gap:8px;margin-top:10px;font-size:15px"><input type="checkbox" id="expDetail" ${expDetail?'checked':''} style="width:20px;height:20px">품목별 상세 내역도 넣기</label>
   <table style="margin-top:10px"><tr><th>달</th><th class="n">건</th><th class="n">지출</th><th style="width:35%"></th></tr>
   ${ms.map(m=>{const r=by(m),t=r.reduce((a,x)=>a+(+x.o.price||0),0);return `<tr><td>${ym(m)}</td><td class="n">${r.length}</td><td class="n money">${won(t)}</td><td><div class="bar" style="margin-top:7px"><i style="width:${t/mx*100}%;background:var(--brand2)"></i></div></td></tr>`}).join('')}
   <tr><th>합계</th><th class="n">${rows.length}</th><th class="n">${won(tot)}</th><th></th></tr></table>
   <p class="muted" style="margin-top:6px">결제를 마친 주문을 결제한 날 기준으로 모아요. 원장님 결재 전 · 결제 전 주문은 빠져요.</p>
   <div class="row" style="margin-top:10px"><button class="btn grow" data-act="expPdf">📄 PDF · 인쇄</button><button class="btn ghost grow" data-act="expCsv">📊 엑셀 파일</button></div></div>`;
}

  const cats=[...new Set(rows.map(x=>catOf(x.o)))],vend=[...new Set(rows.map(x=>x.o.vendor||'기타'))];

   ${expDetail?`<h2>4. 상세 내역 (${rows.length}건)</h2><table><tr><th>결제일</th><th>구분</th><th>분류</th><th>품목</th><th>수량</th><th>구매처</th><th class="n">금액</th><th>결재</th></tr>

function expenseCsv(){
  const rows=spendRows(expFrom,expTo),q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const head=['결제일','달','구분','분류','품목','규격','수량','구매처','금액','주문번호','결재','결제','상태'];
  const body=rows.map(({o,day})=>[day,day.slice(0,7),SITES[o.site],catOf(o),o.name,o.spec,o.qty,o.vendor,+o.price||0,o.orderNo,(lastLog(o,'final')||{}).name,(lastLog(o,'pay')||{}).name,STAGE[o.stage][0]]);
  const ms=monthsBetween(expFrom,expTo);const sumRows=[[],['월별 합계'],['달',...Object.values(SITES),'합계'],...ms.map(m=>{const r=rows.filter(x=>x.day.startsWith(m));return [m,...Object.keys(SITES).map(k=>r.filter(x=>x.o.site===k).reduce((a,x)=>a+(+x.o.price||0),0)),r.reduce((a,x)=>a+(+x.o.price||0),0)]})];
  return '\ufeff'+[head,...body,...sumRows].map(r=>r.map(q).join(',')).join('\r\n');
}
function vReport(){

function shopUrl(o){
  let u=String(o.url||'').trim();
  if(u&&!/^https?:\/\//i.test(u)&&/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(u))u='https://'+u;   // 'smartstore.naver.com/…' 처럼 앞이 빠진 주소
  if(/^https?:\/\//i.test(u))return u;
  const q=encodeURIComponent([o.name,o.spec].filter(Boolean).join(' '));
  if(o.vendor==='네이버')return IS_MOBILE?`https://msearch.shopping.naver.com/search/all?query=${q}`:`https://search.shopping.naver.com/search/all?query=${q}`;
  return `https://www.coupang.com/np/search?q=${q}`}
const lastUrl=(name,site)=>{const x=S.orders.filter(o=>o.name===name&&o.url).sort((a,b)=>(b.date||'').localeCompare(a.date||''));return (x.find(o=>o.site===site)||x[0]||{}).url||''};
// 열기: 안드로이드 앱은 쿠팡 · 네이버 앱/브라우저로, 웹은 새 창으로. 새 창이 막히면 누를 수 있는 링크를 보여 줘요.
function openShop(url){
  if(window.AdminAndroid&&AdminAndroid.openUrl){AdminAndroid.openUrl(url);return}
  let w=null;try{w=window.open(url,'_blank');if(w)try{w.opener=null}catch(e){}}catch(e){}
  if(!w){const host=(url.match(/^https?:\/\/([^/]+)/)||[])[1]||'';
    modal(`<h3>쇼핑몰 열기</h3><p class="muted">브라우저가 새 창을 막았어요. 아래 버튼을 눌러 주세요.</p><p style="margin-top:6px;word-break:break-all;font-size:13px">${esc(host)}</p><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn ghost" data-act="closeModal">닫기</button><a class="btn" href="${esc(url)}" target="_blank" rel="noopener" data-closeafter="1" style="text-decoration:none">열기</a></div>`)}
}

/* ----- 결제 방지 키 ----- */
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let unlockedUntil=0,afterUnlock=null;
function lockState(){let f;try{f=JSON.parse(localStorage.getItem('mp-pk-fail'))||{n:0,t:0}}catch(e){f={n:0,t:0}}return f}
function needKey(fn){
  if(Date.now()<unlockedUntil){fn();return}
  const f=lockState();if(f.n>=5&&Date.now()-f.t<600000){toast(`키를 5번 틀려 잠겼어요 — ${Math.ceil((600000-(Date.now()-f.t))/60000)}분 뒤 다시`);return}
  afterUnlock=fn;
  modal(`<h3>🔒 결제 방지 키</h3><p class="muted">원장님께 받은 결제 방지 키를 넣어 주세요. 5분 동안 결제할 수 있어요.</p><input type="password" inputmode="numeric" id="pkIn" maxlength="8" style="margin-top:8px;font-size:20px;letter-spacing:6px;text-align:center"><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn ghost" data-act="closeModal">취소</button><button class="btn" data-act="pkCheck">확인</button></div>`);
  setTimeout(()=>$('#pkIn')&&$('#pkIn').focus(),50);
}
async function pkCheck(){
  const v=$('#pkIn').value;let K;try{K=await ST.getPayKey(ORG)}catch(e){toast('키를 확인하지 못했어요 — 연결을 확인하세요');return}
  if(!K){toast('원장님이 아직 결제 방지 키를 정하지 않았어요');return}
  if(await sha(K.salt+v)===K.hash){localStorage.removeItem('mp-pk-fail');unlockedUntil=Date.now()+300000;$('#modal').innerHTML='';const f=afterUnlock;afterUnlock=null;f&&f()}
  else{const f=lockState();if(Date.now()-f.t>600000)f.n=0;f.n++;f.t=Date.now();localStorage.setItem('mp-pk-fail',JSON.stringify(f));$('#pkIn').value='';toast(f.n>=5?'5번 틀려 10분간 잠겨요':`키가 맞지 않아요 (${f.n}/5)`)}
}

function parseLunchRules(text){
  const rules=[],pairs=[],notes=[],mentioned=new Set();let last=null;
  String(text||'').split(/\n/).forEach(raw=>{
    let line=raw.trim();if(!line)return;
    let note='';const arrow=line.search(/→|->(?![^()]*\))/);
    if(/^(→|->)/.test(line)){if(last)notes.push({match:last,note:line.replace(/^(→|->)\s*/,'')});return}
    const ni=line.indexOf('→');if(ni>0){note=line.slice(ni+1).trim();line=line.slice(0,ni).trim()}
    line=line.replace(/^(기타|기\s*∥|타\s*∥|기∥|타∥)\s*/,'').replace(/^(기타|타\s*∥|타∥)\s*/,'');
    const pm=line.match(/0\.5\s*\+\s*0\.5\s*:\s*(.+)$/);
    if(pm){const ns=pm[1].split(/[+,]/).map(x=>x.trim()).filter(Boolean);if(ns.length>=2)pairs.push(ns.slice(0,2));return}
    const ci=line.indexOf(':');if(ci<0)return;
    const left=line.slice(0,ci).replace(/\s*[xX×]\s*$/,'').replace(/모든\s*/g,'').trim();
    const match=left.split('&').map(x=>x.trim()).filter(Boolean);if(!match.length)return;
    last=match;if(note)notes.push({match,note});
    const right=line.slice(ci+1).replace(/(->|→)\s*[^/()]*$/,'');
    right.split('/').forEach(seg=>{const re=/([^()]+?)\s*\(([^)]*)\)/g;let m;
      while((m=re.exec(seg))){const people=m[1].split(/[,，]/).map(x=>x.trim()).filter(Boolean);if(people.length)rules.push({match,people,sub:m[2].trim(),label:left})}
      seg.replace(/[^()]*\([^)]*\)/g,'').split(/[,，]/).map(x=>x.trim()).filter(x=>/^[가-힣A-Za-z]{2,10}$/.test(x)).forEach(x=>mentioned.add(x))});
  });
  return {rules,pairs,notes,mentioned:[...mentioned]};
}

function resolveItem(name){const c=LC(),n=nz(name);if(!n)return {skip:true,name:'안 먹음'};

function planDay(ds){
  const c=LC(),d=lday(ds);if(!c||!d||!d.menu||d.off)return null;
  const R=LR(),absent=new Set(d.absent||[]),over=d.over||{};
  const people=c.members.filter(p=>p.active!==false&&!absent.has(p.name));
  const assign=people.map(p=>{
    if(over[p.name]!==undefined)return {who:p.name,raw:over[p.name],why:'직접 지정'};
    const r=R.rules.find(r=>ruleHit(r.match,d.menu)&&r.people.includes(p.name));
    return r?{who:p.name,raw:r.sub,why:'규칙: '+r.label}:{who:p.name,raw:d.menu};
  }).map(a=>({...a,...resolveItem(a.raw)}));
  const lines=new Map(),center=new Map(),skip=[];
  const add=(n,q)=>lines.set(n,(lines.get(n)||0)+q);
  assign.forEach(a=>{if(a.skip)skip.push(a.who);else if(a.store)add(a.name,1);else{const l=center.get(a.name)||[];l.push(a.who);center.set(a.name,l)}});
  const shared=[];
  R.pairs.forEach(([x,y])=>{const A=assign.find(a=>a.who===x),B=assign.find(a=>a.who===y);if(A&&B&&A.store&&B.store&&A.name===B.name&&!A.skip){add(A.name,-1);shared.push(`${x}+${y}`)}});
  if(+d.guests>0)add(resolveItem(d.menu).name,+d.guests);
  const main=resolveItem(d.menu).name;
  if(d.fixed&&d.fixed.length){const arr=d.fixed.filter(l=>l.qty>0).map(l=>({name:l.name,qty:+l.qty,price:+l.price||priceOf(l.name)}));
    return {d,assign,lines:arr,center:[...center.entries()],skip,shared,notes:R.notes.filter(n=>ruleHit(n.match,d.menu)).map(n=>n.note),total:arr.reduce((s,l)=>s+l.qty*l.price,0),count:arr.reduce((s,l)=>s+l.qty,0),unknown:[],fixed:true}}
  const arr=[...lines.entries()].filter(([,q])=>q>0).sort((a,b)=>(b[0]===main)-(a[0]===main)||b[1]-a[1]).map(([name,qty])=>({name,qty,price:priceOf(name)}));

}

document.addEventListener('change',e=>{if(e.target.classList&&e.target.classList.contains('ldIn')){const r=$('#attRes');if(r)delete r.dataset.keep;attCount();e.target.closest('.row').style.background=''}});
function attCount(){const all=[...document.querySelectorAll('.ldIn')],n=all.filter(x=>x.checked).length;const e=$('#attRes');if(e&&!e.dataset.keep)e.innerHTML=`<p class="muted" style="margin:6px 0">출석 ${n}명 · 결석 ${all.length-n}명 — <b>저장</b>을 누르면 수량이 다시 계산돼요</p>`}
function attendPick(ds){const i=document.createElement('input');i.type='file';i.accept='image/*,.pdf,.xlsx,.docx,.hwpx,.csv';i.style.display='none';document.body.appendChild(i);
  i.onchange=async()=>{const f=i.files[0];i.remove();if(!f)return;const box=$('#attRes');if(box)box.innerHTML='<p class="muted">출석부를 읽는 중… (사진은 30초쯤 걸려요)</p>';
    try{const MR=await loadReader();const R=await MR.read(f,t=>{const b=$('#attRes');if(b)b.innerHTML=`<p class="muted">${esc(t)}</p>`});attendApply(ds,R,MR)}catch(e){if(box)box.innerHTML=`<div class="alert w">${esc(e.message||e)}</div>`}};i.click()}
function attendApply(ds,R,MR){const c=LC(),mem=c.members.filter(p=>p.active!==false).map(p=>p.name);
  const nz2=v=>String(v||'').replace(/[\s·.,()\[\]]/g,'');
  const OK=/^(o|0|ㅇ|○|◯|●|v|✓|✔|출|출석|참|참석|사인|서명|y|1|\(\))$/i,NO=/^(x|×|✕|><|\)\(|결|결석|불참|미참|병결|외출|조퇴|휴|-)$/i;
  const m=+ds.slice(5,7),dd=+ds.slice(8,10),dateRe=new RegExp(`^(${m}\\s*[./월-]\\s*)?0?${dd}\\s*(일)?(\\(.\\))?$`);
  const found={};   // 이름 → 'in' | 'out' | 'seen'
  const nameIn=cell=>{const t=nz2(cell);if(t.length<2)return null;return mem.find(n=>t===nz2(n))||mem.find(n=>t.includes(nz2(n))&&nz2(n).length>=2)||(R.ocr?mem.find(n=>MR.similar(n,t)>=0.66):null)};
  let mode='list';
  R.tables.forEach(T=>{const rows=T.rows;
    // 날짜 칸(그날) · 출석 칸 찾기
    let hr=-1,col=-1;for(let r=0;r<Math.min(6,rows.length)&&col<0;r++){rows[r].forEach((h,i)=>{if(col<0&&(dateRe.test(String(h).trim())||/^출석|^출결|^참석/.test(String(h).trim()))){hr=r;col=i}})}
    rows.forEach((r,ri)=>{if(ri<=hr)return;let who=null;for(const cell of r){who=nameIn(cell);if(who)break}if(!who)return;
      let v=col>=0?String(r[col]||'').trim():'';
      if(col<0){const marks=r.map(x=>String(x).trim()).filter(x=>OK.test(x)||NO.test(x));if(marks.length===1)v=marks[0]}
      if(v&&(OK.test(v)||NO.test(v))){mode='marks';found[who]=OK.test(v)?'in':'out'}
      else if(col>=0&&!v){mode='marks';found[who]=found[who]||'out'}
      else if(col>=0&&v){mode='marks';found[who]='in'}   // 서명 등 무엇이든 적혀 있으면 출석
      else found[who]=found[who]||'seen'})});
  // 표가 아니면 글 전체에서 이름 찾기 (출석한 사람 명단)
  if(!Object.keys(found).length){const words=String(R.text||'').split(/[\s,·/]+/);words.forEach(w=>{const n=nameIn(w);if(n)found[n]='seen'})}
  if(!Object.keys(found).length){$('#attRes').innerHTML=`<div class="alert w">출석부에서 회원 이름을 찾지 못했어요. ${R.ocr?'밝은 곳에서 이름 칸이 잘 보이게 다시 찍어 주세요.':'파일에 회원 이름이 있는지 확인해 주세요.'}</div>`;return}
  let inN=0,outN=0;const miss=[];
  document.querySelectorAll('.ldIn').forEach(x=>{const st=found[x.value];
    if(st==='in'||st==='seen'){x.checked=true;inN++}else if(st==='out'){x.checked=false;outN++}
    else{miss.push(x.value);if(mode==='list'){x.checked=false;outN++}}
    x.closest('.row').style.background=st==='out'||(!st&&mode==='list')?'#FFF1F1':st?'#F0FBF5':'#FFF8E5'});
  const e=$('#attRes');e.dataset.keep='1';
  e.innerHTML=`<div class="alert ok" style="margin-top:8px">📋 출석부 반영: 출석 <b>${inN}</b>명 · 결석 <b>${outN}</b>명${miss.length?`<br>${mode==='list'?'출석부에 이름이 없어 결석으로 둔 분':'출석부에서 못 찾아 그대로 둔 분'}: ${esc(miss.join(', '))}`:''}<br>노란 줄은 직접 확인해 주세요. 맞으면 아래 <b>저장</b>을 눌러요.</div>`}

function scoreMenu(menu,ds,ctx){

/* ----- 주문표 읽기 (표 글자 위치 → 날짜별 칸) ----- */
// 도시락 주문표 읽기 (PDF 글자 위치 → 표) — 앱과 같은 코드를 node에서 시험
function shParsePages(pages){
  // pages: [{items:[{s,x,y,w}]}]  y: 위가 큼
  const out=[];
  const HDR=/^\s*(\d{1,2})\s*\/\s*(\d{1,2})\s*\(\s*[월화수목금토일]\s*\)\s*(?::\s*[\d+\s]*)?$/;
  for(const pg of pages){
    const items=pg.items.filter(i=>i.s.trim());
    const text=shLines(items).join('\n').replace(/([가-힣])[ \t]+(?=[가-힣])/g,'$1');
    const tm=text.match(/\[([^\]]+)\]\s*(\d{4})\s*\.\s*(\d{1,2})\s*\/\s*(\d{1,2})\s*~\s*(\d{1,2})\s*\/\s*(\d{1,2})\s*(.*?)\s*주문표(?:\s*\/\s*([\d-]+))?/);
    if(!tm)continue;
    const [,orgName,yy,sm,,em]=tm;const store=tm[7].replace(/\s*\(\s*/g,'(').replace(/\s*\)\s*/g,')').replace(/\s+/g,' ').trim(),storePhone=tm[8]||'';
    const base=+((text.match(/기본\s*개수는\s*(\d+)\s*개/)||[])[1]||0);
    const centerPhone=((text.match(/전화\s*\)\s*(\d{2,3}\s*[-–]\s*\d{3,4}\s*[-–]\s*\d{4})/)||[])[1]||'').replace(/\s/g,'').replace(/–/g,'-');
    // 머리글(날짜) 찾기: '11/16' 와 '(월)'이 따로 떨어진 경우도 합치기
    const hs=shTokens(items).filter(t=>HDR.test(t.s));
    const rows=[];hs.sort((a,b)=>b.y-a.y).forEach(h=>{const r=rows.find(r=>Math.abs(r.y-h.y)<Math.max(4,(h.parts[0].h||0)*0.6));if(r)r.h.push(h);else rows.push({y:h.y,h:[h]})});
    rows.forEach(r=>r.h.sort((a,b)=>a.x-b.x));
    const days=[];
    rows.forEach((r,ri)=>{
      const top=r.y-2,bottom=ri+1<rows.length?rows[ri+1].y+2:-1e9;
      const cols=r.h.map(h=>{const m=h.s.match(HDR);const cm=h.s.match(/:\s*([\d+\s]+)$/);return {cx:h.x+h.w/2,mo:+m[1],d:+m[2],count:cm?cm[1].split('+').reduce((a,b)=>a+(+b||0),0):0}});
      const cell=cols.map(()=>[]);
      const hdrIds=new Set(r.h.flatMap(h=>h.parts));
      items.forEach(i=>{if(i.y<top&&i.y>bottom&&!hdrIds.has(i)&&!rows.some(rr=>rr.h.some(h=>h.parts.includes(i)))){const cx=i.x+i.w/2;let k=0,best=1e9;cols.forEach((c,j)=>{const dd=Math.abs(c.cx-cx);if(dd<best){best=dd;k=j}});cell[k].push(i)}});
      cols.forEach((c,j)=>{let y=+yy;if(c.mo<+sm&&+sm-c.mo>6)y++;const ds=`${y}-${String(c.mo).padStart(2,'0')}-${String(c.d).padStart(2,'0')}`;
        days.push({date:ds,count:c.count,raw:shLines(cell[j]).join(' ').replace(/\s+/g,' ').trim()})});
    });
    out.push({orgName:orgName.trim(),store,storePhone,centerPhone,base,from:days[0]&&days[0].date,to:days.length?days[days.length-1].date:'',days:days.map(d=>{const p=shParseCell(d.raw);if(p.lines&&d.count){const known=p.lines.reduce((a,l)=>a+l.qty,0);const z=p.lines.filter(l=>!l.qty);if(z.length===1)z[0].qty=Math.max(0,d.count-known)}return {...d,...p}})});
  }
  return out;
}
// 같은 줄에서 붙어 있는 글자 조각을 한 낱말로 합치기 ('11/16' '(' '월' ')' → '11/16(월)')
function shTokens(items){const out=[];[...items].sort((a,b)=>b.y-a.y||a.x-b.x).forEach(i=>{const t=out[out.length-1];
  if(t&&Math.abs(t.y-i.y)<Math.max(2,(i.h||0)*0.4)&&i.x-(t.x+t.w)<=Math.max(16,(i.h||0)*1.2)&&i.x>=t.x){t.s+=(i.x-(t.x+t.w)>2?' ':'')+i.s;t.w=i.x+i.w-t.x;t.parts.push(i)}else out.push({s:i.s,x:i.x,y:i.y,w:i.w,parts:[i]})});return out}
function shLines(items){const ls=[];[...items].sort((a,b)=>b.y-a.y||a.x-b.x).forEach(i=>{const l=ls.find(l=>Math.abs(l.y-i.y)<Math.max(3,(i.h||0)*0.5));if(l)l.it.push(i);else ls.push({y:i.y,it:[i]})});
  return ls.map(l=>l.it.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim())}
function shParseCell(raw){
  const t=String(raw||'').trim();
  if(!t||/^[xX✕×]$/.test(t))return {off:true,note:''};
  if(/^[xX✕×]?\s*\(?\s*(대체\s*)?(공휴일|휴일|추석|설날|설|휴무|연휴|방학|소풍|나들이|행사|휴관|휴강|휴원|종강|개천절|한글날|성탄절|크리스마스|어린이날|현충일|광복절|삼일절|선거일?)\s*\)?$/.test(t)||/^[xX]\s*\((.+)\)$/.test(t))return {off:true,note:t.replace(/^[xX✕×]\s*\(?/,'').replace(/\)$/,'').trim()};
  const parts=t.replace(/\s*\+\s*/g,'+').replace(/\s*,\s*(?=[가-힣(])/g,'+').split('+').map(x=>x.trim()).filter(Boolean);
  const L=[];
  parts.forEach(p=>{
    let price=0;const pm=p.match(/\(?\s*([\d,]{3,6})\s*원?\s*\)?/);
    let q=0;const qm=p.match(/(\d+)\s*개/);if(qm)q=+qm[1];
    let name=p.replace(/\(\s*[\d,]{3,6}\s*원?\s*\)/g,' ').replace(/(\d+)\s*개/g,' ').replace(/[()]/g,' ');
    if(pm&&/[\d,]{3,}/.test(pm[1])&&/\(|원/.test(p))price=+pm[1].replace(/,/g,'');
    const tail=name.match(/^(.*?[가-힣])\s*(\d{1,2})\s*$/);if(tail&&!q){name=tail[1];q=+tail[2]}
    name=name.replace(/\s+/g,' ').trim();
    if(!name)return;
    // '+ 미니반찬 볶음김치 (400원)' 처럼 곁들임은 앞 줄에 붙이기
    if(/^미니반찬|^오징어젓갈|^볶음김치/.test(name)&&L.length){L[L.length-1].side=(L[L.length-1].side?L[L.length-1].side+' ':'')+name;return}
    L.push({name,qty:q,price});
  });
  if(!L.length)return {off:true,note:t};
  return {menu:L[0].name,lines:L};
}

/* ===================== 📥 도시락 주문표 불러오기 (PDF · HWPX) =====================
   기존 주문표 파일에서 날짜 · 메뉴 · 수량 · X(휴일)를 읽어 날짜별 주문으로 넣습니다.
   읽는 도구(pdf.js, fflate)는 불러오기를 누를 때만 인터넷에서 받아요. */
// 공용 파일 읽기 도구(lib/maumm-reader.js)를 처음 쓸 때 불러와요: PDF · 워드 · 엑셀 · 한글 HWPX · 사진 · CSV
function loadReader(){if(window.MReader)return Promise.resolve(window.MReader);return new Promise((res,rej)=>{const s=document.createElement('script');s.src=new URL('lib/maumm-reader.js',location.href).href;s.onload=()=>res(window.MReader);s.onerror=()=>rej(new Error('파일 읽기 도구를 불러오지 못했어요'));document.head.appendChild(s)})}
// 사진 글자 인식이 틀린 메뉴 이름을 메뉴 목록의 가장 비슷한 이름으로 바로잡기
function fixOcrDay(d,menus){if(!d.lines)return d;const L=d.lines.map(l=>{const n=l.name.replace(/[^가-힣a-zA-Z0-9 ]/g,'').trim();if(!/[가-힣]{2,}/.test(n))return null;const c=MReader.closest(n,menus,0.45);return {...l,name:c||n}}).filter(Boolean);
  if(!L.length)return {...d,off:true,note:'',lines:null,menu:''};return {...d,lines:L,menu:L[0].name}}
async function importSheetFile(f){
  const MR=await loadReader();const R=await MR.read(f,t=>{const pe=document.getElementById('shProg');if(pe)pe.textContent=t});
  const res=shParsePages(R.pages).filter(p=>p.days.length);
  if(!res.length)throw new Error(R.ocr?'사진에서 주문표 모양을 찾지 못했어요. 표 전체가 나오게, 밝은 곳에서 똑바로 찍어 주세요 (제목 줄과 날짜 칸이 보여야 해요)':'주문표 모양을 찾지 못했어요. 제목에 "[기관] 2026. 11/16 ~ 12/4 ○○ 주문표"와 날짜 칸 "11/16 (월)"이 있는 파일인지 확인해 주세요');
  const menus=(LC()||{menus:[]}).menus.map(m=>m.name);
  res.forEach(p=>{p.ocr=!!R.ocr;if(R.ocr){p.store=MR.closest(p.store,lStores(LC()).map(x=>x.name),0.5)||p.store.replace('한솔','한솥');p.days=p.days.map(d=>fixOcrDay(d,menus))}
    p.days.forEach(d=>{if(d.lines&&d.lines.length===1&&!d.lines[0].qty&&p.base)d.lines[0].qty=p.base})});
  return res.sort((a,b)=>(b.from||'').localeCompare(a.from||''));
}

function at(dateStr,hm){const [h,m]=(hm||'09:00').split(':').map(Number);const d=new Date(dateStr+'T00:00');d.setHours(h||0,m||0,0,0);return d.getTime()}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function buildReminders(){
  const N=L.noti,out=[],now=Date.now();if(!N.on||!S.me)return out;
  const push=(id,t,title,body)=>{if(t>now+30000)out.push({id,at:t,title,body})};
  S.surveys.filter(s=>s.open&&s.due).forEach(s=>{if(!S.requests.some(r=>r.surveyId===s.id&&r.by===AUTH.uid))push('sv-'+s.id,at(ymd(addDays(new Date(s.due+'T00:00'),-1)),N.time),`📝 내일 마감: ${s.title}`,'필요한 물품이 있으면 수요를 내 주세요')});
  if(!isMgr())return out.sort((a,b)=>a.at-b.at);
  const rt=c=>ROUTINE().filter(r=>r.cycle===c);
  const doneAll=(c,d)=>rt(c).every(r=>{const x=CHECKS()[r.id+'|'+periodKey(c,d)];return x&&(x.n||1)>=need(c)});
  if(N.cyc&&(has('buyer')||has('mid')))for(let i=0;i<60;i++){const d=addDays(new Date(),i),ds=ymd(d),dow=d.getDay();
    const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    if(rt('M1').length&&d.getDate()===Math.min(+N.monthDay||1,last)&&!doneAll('M1',d))push('m-'+ds,at(ds,N.time),`📅 ${d.getMonth()+1}월 간식 수요조사 · 구매`,rt('M1').map(r=>r.text).join(' / '));
    if(rt('W1').length&&dow===+N.weekDay&&!doneAll('W1',d))push('w-'+ds,at(ds,N.time),'📋 이번 주 재고 확인',rt('W1').map(r=>r.text).join(' / '));
    if(rt('W2').length&&(N.w2Days||[]).map(Number).includes(dow)){const k=CHECKS()[rt('W2')[0].id+'|'+periodKey('W2',d)];const cnt=k?(k.n||1):0;const idx=(N.w2Days||[]).map(Number).sort().indexOf(dow);if(cnt<=idx)push('r-'+ds,at(ds,N.time),'🍱 레토르트 주문 · 도착 확인',rt('W2').map(r=>r.text).join(' / '))}
  }
  if(N.order)S.orders.forEach(o=>{
    if(o.stage==='ship'&&o.eta&&(has('buyer')||has('mid'))){push('e-'+o.id,at(o.eta,N.time),has('mid')?'📦 오늘 도착 예정 — 수령 검수':'📦 오늘 도착 예정',`${SITES[o.site]} · ${o.name} ${o.qty||''}`);push('e2-'+o.id,at(ymd(addDays(new Date(o.eta+'T00:00'),1)),N.time),'⚠️ 수령 검수가 안 됐어요',`${SITES[o.site]} · ${o.name} — 미도착 · 누락 확인`)}
    if(o.meal&&has('buyer')&&!['done','reject'].includes(o.stage))push('meal-'+o.id,at(ymd(addDays(new Date(o.meal+'T00:00'),-1)),'15:00'),'🍱 내일 식사용 레토르트 도착했나요?',`${SITES[o.site]} · ${o.name} — 식사일 ${md(o.meal)}`);
  });
  if(N.order&&LC()&&(has('buyer')||has('mid')))for(let i=0;i<14;i++){const ds=ymd(addDays(new Date(),i)),pl=planDay(ds);if(pl&&(pl.d.status||'plan')==='plan'){const [h,m]=(LC().deadline||'10:00').split(':').map(Number);const t=`${pad(Math.max(0,h-1))}:${pad(m||0)}`;push('lunch-'+ds,at(ds,t),`🍱 오늘 도시락 ${pl.count}개 — ${LC().deadline} 전 확인`,`${orderLine(pl)} · 결석 · 추가 인원이 있으면 업체에 연락`)}}
  if(N.approve){let k=0;for(let i=0;i<10&&k<3;i++){const d=addDays(new Date(),i),dow=d.getDay();if(dow===0||dow===6)continue;const ds=ymd(d);
      if(has('mid')){const n=S.requests.filter(r=>r.status==='submitted').length+by('review').length+by('arrived').length;if(n)push('mid-'+ds,at(ds,N.time),`🔎 검수할 것 ${n}건`,'수요 · 주문서 · 수령 검수를 확인해 주세요')}
      if(has('final')&&by('final').length)push('fin-'+ds,at(ds,N.lunch),`👨‍⚕️ 결재 대기 ${by('final').length}건`,`합계 ${won(sumP(by('final')))} — 점심 회의 때 결재해 주세요`);
      if(has('buyer')){const p=by('pay').length,a=S.requests.filter(r=>r.status==='accepted').length;if(p)push('pay-'+ds,at(ds,N.time),`💳 결제할 주문 ${p}건`,'원장님 결재가 끝났어요 — 결제 방지 키로 결제하세요');if(a)push('acc-'+ds,at(ds,N.time),`🧾 주문서 쓸 수요 ${a}건`,'검수 통과한 수요를 주문서로 만들어 주세요')}
      k++}}
  return out.sort((a,b)=>a.at-b.at).slice(0,60);
}
