<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F5D50">
<title>물품 구매 관리</title>
<style>
:root{--bg:#F4F5F1;--card:#fff;--ink:#22302C;--sub:#66726D;--line:#E0E4DE;--brand:#2F5D50;--brand2:#3E7A69;--soft:#E6F0EC;
--clinic:#3A6894;--center:#2F7A56;--brain:#8A5BA8;--warn:#B5602A;--wbg:#FBEEE2;--bad:#B03A3A;--bbg:#F8E3E3;--ok:#2F7A56;--okbg:#E2F1E8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
 padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 84px);word-break:keep-all}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid #D3D9D2;border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--sub);margin:8px 0 3px;font-weight:700}
header{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
header h1{font-size:19px;flex:1;line-height:1.25}
header h1 small{display:block;font-size:12px;color:var(--sub);font-weight:400}
.logo{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:18px;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3{font-size:13.5px;margin:12px 0 6px;color:var(--brand)}
.muted{color:var(--sub);font-size:13px}
.btn{background:var(--brand);color:#fff;border-radius:10px;padding:9px 14px;font-weight:700;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--brand)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{background:var(--bbg);color:var(--bad)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center}
.row.w{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bd{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--bg);color:var(--sub);border:1px solid var(--line);white-space:nowrap}
.bd.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.bd.w{background:var(--wbg);color:var(--warn);border-color:transparent}
.bd.e{background:var(--bbg);color:var(--bad);border-color:transparent}
.site{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;color:#fff}
.s-clinic{background:var(--clinic)}.s-center{background:var(--center)}.s-brain{background:var(--brain)}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:none}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid #C8CFC7;flex:none;display:grid;place-items:center;font-weight:900;color:#fff;margin-top:1px}
.ck.on{background:var(--ok);border-color:var(--ok)}
.ck.half{background:linear-gradient(90deg,var(--ok) 50%,transparent 50%);border-color:var(--ok)}
.task .t{font-weight:700}
.task .d{font-size:12.5px;color:var(--sub)}
.task.done .t{color:var(--sub);text-decoration:line-through}
.alert{font-size:13.5px;border-radius:10px;padding:9px 11px;margin-bottom:8px}
.alert.w{background:var(--wbg);color:var(--warn)}.alert.e{background:var(--bbg);color:var(--bad)}.alert.ok{background:var(--okbg);color:var(--ok)}
.biz{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.biz b{font-size:18px;letter-spacing:1px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;white-space:nowrap;background:#fff}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stock{display:flex;gap:4px}
.stock button{padding:5px 8px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;background:#fff}
.stock button.on.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok);font-weight:700}
.stock button.on.low{background:var(--wbg);color:var(--warn);border-color:var(--warn);font-weight:700}
.stock button.on.out{background:var(--bbg);color:var(--bad);border-color:var(--bad);font-weight:700}
.ord{padding:11px 0;border-top:1px solid var(--line)}
.ord:first-child{border-top:none}
.ord .h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--sub)}
.ord .n{font-weight:700;margin-top:2px}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum div{background:var(--bg);border-radius:10px;padding:8px 4px}
.sum b{display:block;font-size:17px;color:var(--brand)}
.sum span{font-size:11.5px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:700;font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--sub);gap:1px;padding:4px 0;position:relative}
nav button .ic{font-size:20px;line-height:1.2}
nav button.on{color:var(--brand);font-weight:700}
nav .dot[hidden]{display:none}
nav .dot{position:absolute;top:2px;left:55%;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:15}
.modal .sheet{background:#fff;width:100%;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:90vh;overflow:auto}
.modal h3{font-size:16px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:14px 0}
.x{font-size:19px;color:var(--sub);line-height:1;padding:0 4px;margin-left:auto}
.steps li{margin:0 0 8px 18px}
.steps b{color:var(--brand)}
dl dt{font-size:12px;color:var(--sub);margin-top:8px;font-weight:700}
dl dd{white-space:pre-wrap}
.line{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none}
.line .ln{flex:1;min-width:48px;text-align:center;background:var(--bg);border-radius:10px;padding:6px 2px}
.line .ln b{display:block;font-size:17px;color:var(--sub)}.line .ln span{font-size:10.5px;color:var(--sub);line-height:1.2;display:block}
.line .ln.on{background:var(--wbg)}.line .ln.on b{color:var(--warn)}
.line i{color:#B7C0B8;font-style:normal;font-size:12px}
button.alert{border:none;font:inherit;cursor:pointer}
input:disabled{background:#F2F3F0;color:var(--sub)}
</style></head><body>

<script>
/* ===================== 물품 구매 관리 =====================
   근거: 「물품 구매 업무 인수인계서 및 체크리스트」 (외래 병원 · 센터 · 브레인)
   결재 라인: 직원 수요 → 중간관리자 검수 → 최종관리자(원장님) 결재 → 구매 담당 결제(결제 방지 키) → 중간관리자 수령 검수 */
const ST=window.MP_STORE;
const SITES={clinic:'외래 병원',center:'센터',brain:'브레인'};
const CYCLES={M1:'월 1회',W1:'주 1회',W2:'주 2회',ASK:'필요 시',REQ:'요청 시',AFTER:'주문 후'};
const VENDORS=['쿠팡','네이버','기타'];
const ROLES={staff:'직원',mid:'중간관리자',final:'최종관리자 (원장님)',buyer:'구매 담당',admin:'관리자'};
const ROLE_DESC={staff:'수요 내기',mid:'수요 · 주문 검수, 수령 검수',final:'최종 결재',buyer:'주문서 작성 · 결제',admin:'구성원 · 설정 관리'};
const STAGE={review:['중간관리자 검수','w'],final:['원장님 결재','w'],pay:['결제 대기','ok'],ship:['배송 중','w'],arrived:['도착 · 수령 검수','w'],done:['검수 완료','ok'],issue:['문제 (누락 · 파손)','e'],reject:['반려','e']};
const REQ_ST={submitted:['검수 대기','w'],accepted:['검수 통과 · 구매 대기','ok'],rejected:['반려','e'],ordered:['주문 진행 중','w'],done:['받음','ok']};
const DEFAULT_BIZ='207-91-38162';
let _n=0;const uid=()=>Date.now().toString(36)+(_n++).toString(36)+Math.random().toString(36).slice(2,5);
const DEFAULT_ROUTINE=()=>[
 ['M1','원장님 및 데스크 간호사 간식 조사·구매'],['M1','센터 치료진 간식 조사·구매'],['M1','브레인 간식 조사·구매'],
 ['W1','외래 병원 사무용품 및 소모품 재고 확인'],['W1','센터 사무용품 및 생활 소모품 재고 확인'],['W1','쌀 재고 확인 및 필요 시 구매'],
 ['W2','레토르트 식품 주문 및 식사 전날 도착 여부 확인'],['ASK','김수용 씨에게 제과제빵 재료 필요 여부 문의'],
 ['ASK','외래 병원·센터·브레인 추가 요청 물품 구매'],['AFTER','배송 완료 및 실제 물품 수령 여부 확인']].map(([c,t])=>({id:uid(),cycle:c,text:t}));
const DEFAULT_ITEMS=()=>[
 ['clinic','간식','원장님 간식','M1','널담 베이글, 우유, 두유 위주 구매. 부족하면 수시 구매',false],
 ['clinic','간식','데스크 간호사 간식','M1','간호사분께 필요한 간식을 확인하고 구매 (임의로 고르지 않기)',false],
 ['clinic','사무·소모품','외래 복합기 잉크','W1','복합기에 맞는 잉크 종류 · 모델명 · 호환 여부, 기존 구매 내역 확인 후 구매',true],
 ['clinic','기타','기타 요청 물품','REQ','외래 병원 요청 물품 — 품목 · 규격 · 수량 확인 후 주문',false],
 ['center','간식·식품','치료진 간식','M1','필요한 간식 조사 후 구매. 재고 부족 시 추가 구매',false],
 ['center','간식·식품','쌀','W1','재고 확인 후 구매. 치료진 및 회원분 요청 시 수시 구매',true],
 ['center','간식·식품','레토르트 식품','W2','식사 전날까지 도착하도록 주문',false],
 ['center','사무·생활 소모품','대형 롤휴지','W1','남은 수량 확인',true],
 ['center','사무·생활 소모품','물티슈','W1','남은 수량 확인',true],
 ['center','사무·생활 소모품','A4 용지','W1','재고 확인 후 구매',true],
 ['center','사무·생활 소모품','B5 용지','W1','A4와 규격 구분하여 구매',true],
 ['center','사무·생활 소모품','주방세제','W1','재고 확인',true],
 ['center','사무·생활 소모품','세탁세제','W1','재고 확인',true],
 ['center','사무·생활 소모품','종이컵 10oz','W1','용량 확인 후 구매 (실제 구매 규격 확인 필요)',true],
 ['center','사무·생활 소모품','작은 종이컵','W1','기존 구매 제품의 용량 확인',true],
 ['center','사무·생활 소모품','종이용기 1,000cc','W1','기존 구매 제품의 규격 확인 (실제 구매 규격 확인 필요)',true],
 ['center','사무·생활 소모품','탁구공','W1','남은 수량 및 추가 필요 여부 확인',true],
 ['center','제과제빵','제과제빵용 대용량 버터','ASK','김수용 씨에게 필요 수량 및 기존 제품 확인',false],
 ['center','제과제빵','제과제빵용 설탕','ASK','김수용 씨에게 필요 수량 및 종류 확인',false],
 ['center','제과제빵','제과제빵용 머핀컵','ASK','김수용 씨에게 크기 및 필요 수량 확인',false],
 ['center','제과제빵','제과제빵용 밀가루','ASK','김수용 씨에게 종류 및 필요 수량 확인',false],
 ['center','제과제빵','기타 제과제빵 재료','ASK','김수용 씨 요청에 따라 구매',false],
 ['brain','간식','브레인 간식','M1','필요한 간식을 조사하여 구매. 재고 소진 또는 추가 요청 시 수시 구매. 센터와 재고 · 수량 구분',false]
].map(([site,cat,name,cycle,rule,stock])=>({id:uid(),site,cat,name,cycle,rule,stock}));
const DEFAULT_SETTINGS={bizNo:DEFAULT_BIZ,addr:{clinic:'',center:'',brain:''},approveItem:100000,approveOrder:200000};
const DEFAULT_NOTI={on:true,time:'09:00',monthDay:1,weekDay:1,w2Days:[1,4],lunch:'11:50',cyc:true,order:true,approve:true};

/* ===================== 상태 ===================== */
let AUTH=null,ORG=null,UNSUB=null,ready=false;
let S={me:null,org:null,members:[],requests:[],orders:[],surveys:[]};
let BASE={};               // 서버에서 받은 마지막 모습 (바뀐 것만 저장하기 위해)
const LK='mp-prefs-v1';
let L;try{L=JSON.parse(localStorage.getItem(LK))||{}}catch(e){L={}}
L.noti={...DEFAULT_NOTI,...(L.noti||{})};
const saveL=()=>{try{localStorage.setItem(LK,JSON.stringify(L))}catch(e){}syncReminders()};
const O=()=>S.org||{};
const SET=()=>({...DEFAULT_SETTINGS,...(O().settings||{}),addr:{...DEFAULT_SETTINGS.addr,...((O().settings||{}).addr||{})}});
const ITEMS=()=>O().items||[];
const ROUTINE=()=>O().routine||[];
const CHECKS=()=>O().checks||(S.org&&(S.org.checks={}))||{};
const STOCK=()=>O().stock||(S.org&&(S.org.stock={}))||{};
const myRoles=()=>(S.me&&S.me.roles)||[];
const has=r=>myRoles().includes(r)||(r==='admin'&&O().owner===(AUTH&&AUTH.uid));
const isMgr=()=>['mid','final','buyer','admin'].some(has);
const myName=()=>(S.me&&S.me.name)||'';
const orgName=()=>O().name||'구의연세정신건강의학과';

function onData(part){
  for(const k of Object.keys(part)){
    S[k]=part[k];
    if(Array.isArray(part[k]))BASE[k]=Object.fromEntries(part[k].map(x=>[x.id,JSON.stringify(x)]));
    else if(k==='org')BASE.org=part[k]?Object.fromEntries(['name','settings','items','routine','checks','stock'].map(f=>[f,JSON.stringify(part[k][f]??null)])):{};
  }
  if(!S.me||S.me.active===false){if('me' in part){ready=false;view='gone';render()}return}
  ready=true;
  if(!$('#modal').innerHTML||part.me)render();else renderNav();
  syncReminders();
}
// 바뀐 것만 서버에 저장합니다
function save(){
  if(!ORG)return;
  const errs=e=>{console.error(e);toast('⚠️ 저장하지 못했어요 — 권한 또는 연결을 확인하세요')};
  for(const col of ['requests','orders','surveys']){
    const base=BASE[col]||{},cur=S[col]||[],ids=new Set(cur.map(x=>x.id));
    cur.forEach(x=>{const j=JSON.stringify(x);if(base[x.id]!==j){base[x.id]=j;const {id,...d}=x;ST.put(ORG,col,id,d).catch(errs)}});
    Object.keys(base).forEach(id=>{if(!ids.has(id)){delete base[id];ST.del(ORG,col,id).catch(errs)}});
    BASE[col]=base;
  }
  if(S.org){const patch={};BASE.org=BASE.org||{};['name','settings','items','routine','checks','stock'].forEach(f=>{const j=JSON.stringify(S.org[f]??null);if(BASE.org[f]!==j){BASE.org[f]=j;patch[f]=S.org[f]}});
    if(Object.keys(patch).length)ST.saveOrg(ORG,patch).catch(errs)}
  syncReminders();
}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const won=n=>(Number(n)||0).toLocaleString('ko-KR')+'원';
const DOW='일월화수목금토';
const md=s=>{if(!s)return '-';const d=new Date(String(s).slice(0,10)+'T00:00');if(isNaN(d))return '-';return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2400)}
function weekStart(d=new Date()){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x}
function periodKey(cycle,d=new Date()){if(cycle==='M1')return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;if(cycle==='W1'||cycle==='W2')return 'W'+ymd(weekStart(d));return 'D'+ymd(d)}
function periodLabel(cycle){if(cycle==='M1'){const d=new Date();return `${d.getMonth()+1}월`}if(cycle==='W1'||cycle==='W2'){const s=weekStart(),e=new Date(s);e.setDate(e.getDate()+6);return `${s.getMonth()+1}/${s.getDate()}~${e.getMonth()+1}/${e.getDate()}`}return '오늘'}
const need=c=>c==='W2'?2:1;
function doneCount(id,cycle){const c=CHECKS()[id+'|'+periodKey(cycle)];return c?(c.n||1):0}
const isRegular=c=>['M1','W1','W2'].includes(c);
const stamp=(note)=>({by:AUTH.uid,name:myName(),at:new Date().toISOString(),...(note?{note}:{})});
function logStage(o,st,note){o.log=o.log||[];o.log.push({st,...stamp(note)})}
const lastLog=(o,st)=>(o.log||[]).filter(l=>l.st===st).slice(-1)[0];
const appCard=o=>{const st=SET();if((+o.price||0)>=st.approveItem)return true;if(!o.payGroup)return false;return S.orders.filter(x=>x.date===o.date&&x.payGroup===o.payGroup).reduce((a,x)=>a+(+x.price||0),0)>=st.approveOrder};
const sumP=a=>a.reduce((s,o)=>s+(+o.price||0),0);
const by=st=>S.orders.filter(o=>o.stage===st);

/* ===================== 알림 목록 (할 일) ===================== */
function myQueue(){
  const q=[],t=today();
  if(has('mid')){
    const r=S.requests.filter(x=>x.status==='submitted');if(r.length)q.push({lvl:'w',go:'demand',txt:`📩 수요 검수 ${r.length}건`});
    const o=by('review');if(o.length)q.push({lvl:'w',go:'order',of:'review',txt:`🔎 주문서 검수 ${o.length}건 · ${won(sumP(o))}`});
    const a=S.orders.filter(o=>o.stage==='arrived'||(o.stage==='ship'&&o.eta&&o.eta<=t));if(a.length)q.push({lvl:'w',go:'order',of:'recv',txt:`📦 수령 검수 ${a.length}건`});
  }
  if(has('final')){const o=by('final');if(o.length)q.push({lvl:'w',act:'finalView',txt:`👨‍⚕️ 원장님 결재 ${o.length}건 · ${won(sumP(o))}`})}
  if(has('buyer')){
    const r=S.requests.filter(x=>x.status==='accepted');if(r.length)q.push({lvl:'w',go:'demand',txt:`🧾 검수 통과한 수요 ${r.length}건 — 주문서 작성`});
    const p=by('pay');if(p.length)q.push({lvl:'ok',go:'order',of:'pay',txt:`💳 결재 완료 · 결제할 주문 ${p.length}건 · ${won(sumP(p))}`});
    const rj=by('reject');if(rj.length)q.push({lvl:'e',go:'order',of:'all',txt:`↩️ 반려된 주문서 ${rj.length}건 — 고쳐서 다시 올리기`});
    S.orders.forEach(o=>{
      if(o.stage==='ship'&&o.eta&&o.eta<t)q.push({lvl:'e',go:'order',of:'recv',txt:`⚠️ ${o.name}: 배송 예정일(${md(o.eta)})이 지났어요`});
      if(o.meal&&['ship','pay','final','review'].includes(o.stage)&&(!o.eta||o.eta>=o.meal))q.push({lvl:'e',go:'order',txt:`🍱 ${o.name}: 식사일(${md(o.meal)}) 전날까지 도착하지 않아요`});
    });
  }
  if(has('buyer')||has('mid'))S.orders.filter(o=>o.stage==='issue').forEach(o=>q.push({lvl:'e',go:'order',of:'recv',txt:`⚠️ ${o.name}: ${o.issue||'누락 · 파손'} — 교환 또는 재주문`}));
  return q;
}

  <div class="chips">${[['open','진행 중'],['review',`검수 ${by('review').length}`],['final',`결재 ${by('final').length}`],['pay',`결제 ${by('pay').length}`],['recv',`수령 ${S.orders.filter(F.recv).length}`],['all','전체']].map(([k,l])=>`<button class="chip ${orderF===k?'on':''}" data-of="${k}">${l}</button>`).join('')}</div>

   <li><b>결제</b> — 구매 담당이 결제 방지 키를 넣고 쿠팡 · 네이버 사업자 결제. 레토르트는 식사 전날까지 도착하도록</li>
   <li><b>수령 검수</b> — 중간관리자가 실제 수량 · 제품 확인, 누락 · 파손 · 오배송은 교환 또는 재주문</li></ol></div>`;

function orderRow(o){
  const [lab,cls]=STAGE[o.stage]||['?',''];
  let rc=`<span class="bd ${cls}">${lab}</span>`;
  if(o.stage==='ship'&&o.eta&&o.eta<today())rc='<span class="bd e">미도착</span>';
  const b=[];const B=(attr,txt,k='')=>b.push(`<button class="btn sm ${k}" ${attr}>${txt}</button>`);
  if(o.stage==='review'&&has('mid')){B(`data-midok="${o.id}"`,'✓ 검수 통과');B(`data-reject="${o.id}"`,'반려','danger')}
  if(o.stage==='final'&&has('final')){B(`data-finalok="${o.id}"`,'✓ 결재');B(`data-reject="${o.id}"`,'반려','danger')}
  if(o.stage==='pay'&&has('buyer')){if(o.vendor!=='기타')B(`data-shop="${o.id}"`,`🔒 ${o.vendor||'쿠팡'}에서 결제`);B(`data-paid="${o.id}"`,'🔒 결제 완료 기록',o.vendor!=='기타'?'ghost':'')}
  if(o.stage==='ship'&&(has('buyer')||has('mid')))B(`data-arrived="${o.id}"`,'📦 도착했어요');
  if(['ship','arrived'].includes(o.stage)&&has('mid')){B(`data-inspok="${o.id}"`,'✓ 수령 검수 완료');B(`data-issue="${o.id}"`,'누락 · 파손','danger')}
  if(o.stage==='issue'&&has('buyer')&&!o.reordered)B(`data-reorder="${o.id}"`,'재주문서','ghost');
  if(o.stage==='issue'&&has('mid'))B(`data-inspok="${o.id}"`,'해결 · 검수 완료','ghost');
  if(o.stage==='reject'&&(has('buyer')||has('mid')))B(`data-resubmit="${o.id}"`,'고쳐서 다시 올리기','ghost');
  if(['review','final','reject'].includes(o.stage)&&(has('buyer')||has('mid')))B(`data-edit="${o.id}"`,'고치기','ghost');
  B(`data-hist="${o.id}"`,'결재 기록','ghost');
  const L1=lastLog(o,'reject');
  return `<div class="ord"><div class="h"><span class="site s-${o.site}">${SITES[o.site]}</span>${md(o.date)} · ${esc(o.vendor||'-')}${rc}${appCard(o)?'<span class="bd">원장님 앱카드</span>':''}</div>
   <div class="row" style="justify-content:space-between"><div class="n">${esc(o.name)}${o.spec?` <span class="muted">${esc(o.spec)}</span>`:''} · ${esc(o.qty||'')}</div><span class="money">${won(o.price)}</span></div>
   <div class="muted" style="font-size:12.5px">${signLine(o)}${o.eta?` · 배송 예정 ${md(o.eta)}`:''}${o.meal?` · 식사일 ${md(o.meal)}`:''}${o.note?` · ${esc(o.note)}`:''}${o.issue?` · 문제: ${esc(o.issue)}`:''}${o.stage==='reject'&&L1?` · 반려(${esc(L1.name)}): ${esc(L1.note||'')}`:''}</div>
   <div class="row w" style="margin-top:6px">${b.join('')}</div></div>`;
}
function signLine(o){const p=[];const a=lastLog(o,'review'),f=lastLog(o,'final'),y=lastLog(o,'pay'),i=lastLog(o,'done');
  if(o.reqIds&&o.reqIds.length)p.push(`수요 ${o.reqIds.length}건`);
  if(a)p.push(`검수 ${esc(a.name)}`);if(f)p.push(`결재 ${esc(f.name)}`);if(y)p.push(`결제 ${esc(y.name)} ${md(y.at)}${o.orderNo?' #'+esc(o.orderNo):''}`);if(i)p.push(`수령검수 ${esc(i.name)}`);
  return p.join(' → ')||`작성 ${esc((lastLog(o,'create')||{}).name||'')}`}

/* ----- 결제 방지 키 ----- */
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let unlockedUntil=0,afterUnlock=null;
function lockState(){let f;try{f=JSON.parse(localStorage.getItem('mp-pk-fail'))||{n:0,t:0}}catch(e){f={n:0,t:0}}return f}
function needKey(fn){
  if(Date.now()<unlockedUntil){fn();return}
  const f=lockState();if(f.n>=5&&Date.now()-f.t<600000){toast(`키를 5번 틀려 잠겼어요 — ${Math.ceil((600000-(Date.now()-f.t))/60000)}분 뒤 다시`);return}
  afterUnlock=fn;
  modal(`<h3>🔒 결제 방지 키</h3><p class="muted">원장님께 받은 결제 방지 키를 넣어 주세요. 5분 동안 결제할 수 있어요.</p><input type="password" inputmode="numeric" id="pkIn" maxlength="8" style="margin-top:8px;font-size:20px;letter-spacing:6px;text-align:center"><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn ghost" data-act="closeModal">취소</button><button class="btn" data-act="pkCheck">확인</button></div>`);
  setTimeout(()=>$('#pkIn')&&$('#pkIn').focus(),50);
}
async function pkCheck(){
  const v=$('#pkIn').value;let K;try{K=await ST.getPayKey(ORG)}catch(e){toast('키를 확인하지 못했어요 — 연결을 확인하세요');return}
  if(!K){toast('원장님이 아직 결제 방지 키를 정하지 않았어요');return}
  if(await sha(K.salt+v)===K.hash){localStorage.removeItem('mp-pk-fail');unlockedUntil=Date.now()+300000;$('#modal').innerHTML='';const f=afterUnlock;afterUnlock=null;f&&f()}
  else{const f=lockState();if(Date.now()-f.t>600000)f.n=0;f.n++;f.t=Date.now();localStorage.setItem('mp-pk-fail',JSON.stringify(f));$('#pkIn').value='';toast(f.n>=5?'5번 틀려 10분간 잠겨요':`키가 맞지 않아요 (${f.n}/5)`)}
}

/* ===================== 휴대폰 알림 (역할별) ===================== */
function at(dateStr,hm){const [h,m]=(hm||'09:00').split(':').map(Number);const d=new Date(dateStr+'T00:00');d.setHours(h||0,m||0,0,0);return d.getTime()}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function buildReminders(){
  const N=L.noti,out=[],now=Date.now();if(!N.on||!S.me)return out;
  const push=(id,t,title,body)=>{if(t>now+30000)out.push({id,at:t,title,body})};
  S.surveys.filter(s=>s.open&&s.due).forEach(s=>{if(!S.requests.some(r=>r.surveyId===s.id&&r.by===AUTH.uid))push('sv-'+s.id,at(ymd(addDays(new Date(s.due+'T00:00'),-1)),N.time),`📝 내일 마감: ${s.title}`,'필요한 물품이 있으면 수요를 내 주세요')});
  if(!isMgr())return out.sort((a,b)=>a.at-b.at);
  const rt=c=>ROUTINE().filter(r=>r.cycle===c);
  const doneAll=(c,d)=>rt(c).every(r=>{const x=CHECKS()[r.id+'|'+periodKey(c,d)];return x&&(x.n||1)>=need(c)});
  if(N.cyc&&(has('buyer')||has('mid')))for(let i=0;i<60;i++){const d=addDays(new Date(),i),ds=ymd(d),dow=d.getDay();
    const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    if(rt('M1').length&&d.getDate()===Math.min(+N.monthDay||1,last)&&!doneAll('M1',d))push('m-'+ds,at(ds,N.time),`📅 ${d.getMonth()+1}월 간식 수요조사 · 구매`,rt('M1').map(r=>r.text).join(' / '));
    if(rt('W1').length&&dow===+N.weekDay&&!doneAll('W1',d))push('w-'+ds,at(ds,N.time),'📋 이번 주 재고 확인',rt('W1').map(r=>r.text).join(' / '));
    if(rt('W2').length&&(N.w2Days||[]).map(Number).includes(dow)){const k=CHECKS()[rt('W2')[0].id+'|'+periodKey('W2',d)];const cnt=k?(k.n||1):0;const idx=(N.w2Days||[]).map(Number).sort().indexOf(dow);if(cnt<=idx)push('r-'+ds,at(ds,N.time),'🍱 레토르트 주문 · 도착 확인',rt('W2').map(r=>r.text).join(' / '))}

    const name=$('#fName').value.trim(),price=$('#fPrice').value;
    if(!name){toast('구매 품목을 적어 주세요');return}
    if(price===''||isNaN(+price)){toast('금액을 숫자로 적어 주세요 (결재에 필요해요)');return}
    const body={date:$('#fDate').value||today(),site:$('#fSite').value,name,spec:$('#fSpec').value.trim(),qty:$('#fQty').value.trim(),price:+price,vendor:$('#fVendor').value,eta:$('#fEta').value,meal:$('#fMeal').value,payGroup:$('#fGroup').value.trim(),note:$('#fNote').value.trim(),url:$('#fUrl').value.trim()};
    if(d.saveorder){const o=ord(d.saveorder);const changed=['name','price','qty','spec'].some(k=>String(o[k]??'')!==String(body[k]??''));Object.assign(o,body);
      if(o.stage==='reject'&&window._resubmit){o.stage=(o.reqIds&&o.reqIds.length&&!(o.log||[]).some(l=>l.st==='review'))?'final':'review';logStage(o,'resubmit')}
      else if(o.stage==='final'&&changed&&lastLog(o,'review')&&!has('mid')){o.stage='review';logStage(o,'edit','결재 전 수정 → 다시 검수');toast('내용이 바뀌어 중간관리자 검수부터 다시 받아요')}
      else logStage(o,'edit');}
    else{const dr=window._draft||{};const o={id:uid(),...body,reqIds:dr.reqIds||[],stage:(dr.reqIds&&dr.reqIds.length)?'final':'review',log:[]};logStage(o,'create');
      if(o.reqIds.length)o.reqIds.forEach(i=>{const r=S.requests.find(x=>x.id===i);if(r){r.status='ordered';r.orderId=o.id}});
      S.orders.push(o);toast(o.stage==='final'?'저장 — 원장님 결재로 올라갔어요':'저장 — 중간관리자 검수로 올라갔어요')}
    window._resubmit=false;save();closeModal();return}
  if(d.copyaddr){const a=SET().addr[d.copyaddr];if(!a){toast('주소가 아직 없어요');return}copy(a,'주소를 복사했어요');return}
  if(d.w2!==undefined){const N=L.noti,i=+d.w2;let a=(N.w2Days||[]).map(Number);a=a.includes(i)?a.filter(x=>x!==i):[...a,i].slice(-2);N.w2Days=a.sort();saveL();render();scrollTo(0,y);return}
  if(d.mrole){const m=S.members.find(x=>x.id===d.mrole);let r=m.roles||[];r=r.includes(d.r)?r.filter(x=>x!==d.r):[...r,d.r];if(m.id===AUTH.uid&&d.r==='admin'&&!r.includes('admin')&&O().owner!==AUTH.uid){toast('내 관리자 역할은 직접 뺄 수 없어요');return}
    if(!r.length)r=['staff'];const {id,...md2}=m;try{await ST.put(ORG,'members',id,{...md2,roles:r})}catch(err){toast(errMsg(err))}return}
  if(d.mout){const m=S.members.find(x=>x.id===d.mout);const {id,...md2}=m;try{await ST.put(ORG,'members',id,{...md2,active:m.active===false})}catch(err){toast(errMsg(err))}return}
  if(d.testrole){let r=myRoles();r=r.includes(d.testrole)?r.filter(x=>x!==d.testrole):[...r,d.testrole];ST.setMyRoles(r.length?r:['staff']);return}
  switch(d.act){
    case 'closeModal':closeModal();break;
    case 'copyBiz':copy(SET().bizNo,'사업자등록번호를 복사했어요');break;
    case 'newOrder':window._resubmit=false;orderForm();break;
    case 'newReq':reqForm();break;
    case 'newSurvey':surveyForm();break;
    case 'saveSurvey':{const ti=$('#sTitle').value.trim();if(!ti){toast('제목을 적어 주세요');return}S.surveys.push({id:uid(),title:ti,site:$('#sSite').value,due:$('#sDue').value,note:$('#sNote').value.trim(),open:true,at:new Date().toISOString(),by:AUTH.uid,byName:myName()});save();closeModal();toast('수요조사를 열었어요 — ‘직원에게 알리기’로 알려 주세요');break}
    case 'saveReq':{const nm=$('#rName').value.trim();if(!nm){toast('품목을 적어 주세요');return}const sv=$('#rSv')?$('#rSv').value:'';S.requests.push({id:uid(),at:new Date().toISOString(),by:AUTH.uid,byName:myName(),site:$('#fSite').value,name:nm,qty:$('#rQty').value.trim(),due:$('#rDue').value,reason:$('#rReason').value.trim(),surveyId:sv,status:'submitted'});save();closeModal();toast('수요를 냈어요 — 중간관리자가 검수해요');break}
    case 'lowToReq':{let n=0;ITEMS().forEach(i=>{const s=STOCK()[i.id];if(s&&s.state!=='ok'&&!S.requests.some(r=>['submitted','accepted'].includes(r.status)&&r.name===i.name&&r.site===i.site)){addReq(i.site,i.name,'',s.state==='out'?'재고 없음':'재고 부족');n++}});save();render();toast(n?`${n}개를 수요로 올렸어요`:'이미 모두 올라가 있어요');break}
    case 'finalView':finalScreen();break;
    case 'finalAll':by('final').forEach(o=>{o.stage='pay';logStage(o,'final')});save();closeModal();toast('모두 결재했어요');break;
    case 'pkCheck':pkCheck();break;
    case 'openCart':openShop('https://cart.coupang.com/cartView.pang');break;
    case 'payAllCoupang':needKey(()=>{const ok=by('pay').filter(o=>(o.vendor||'쿠팡')==='쿠팡');if(!ok.length){toast('결제할 쿠팡 주문이 없어요');return}payQueue=ok.map(o=>o.id);payPending=payQueue.shift();copy(SET().bizNo,`사업자번호 복사됨 · ${ok.length}건 중 1번째를 열어요`);setTimeout(()=>openShop(shopUrl(ord(payPending))),400)});break;
    case 'setPayKey':{const a=$('#pk1').value,b=$('#pk2').value;if(!/^\d{4,8}$/.test(a)){toast('숫자 4~8자리로 정해 주세요');return}if(a!==b){toast('두 번 넣은 키가 달라요');return}
      const salt=uid()+uid();try{await ST.setPayKey(ORG,{salt,hash:await sha(salt+a)});$('#pk1').value=$('#pk2').value='';$('#pkState').textContent='✅ 저장했어요';toast('결제 방지 키를 저장했어요 — 구매 담당에게만 알려 주세요')}catch(err){toast(errMsg(err))}break}
    case 'shareCode':share(`[${orgName()}] 물품 구매 관리 앱\n1) 앱 설치 후 이메일로 가입\n2) 참여 코드 ${O().joinCode} 입력\n3) 수요 탭에서 필요한 물품을 내 주세요`);break;
    case 'newCode':try{await ST.newJoinCode(ORG,O().joinCode);toast('새 참여 코드를 만들었어요 — 예전 코드는 못 써요')}catch(err){toast(errMsg(err))}break;
    case 'editItems':editItemsForm();break;
    case 'saveItems':{const its=[],bad=[];$('#eItems').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{const [s,c,n,cy,r,st]=l.split('|').map(x=>(x||'').trim());const site=SITE_BY_NAME[s],cycle=CYC_BY_NAME[cy];if(!site||!n||!cycle){bad.push(i+1);return}const old=ITEMS().find(x=>x.site===site&&x.name===n);its.push({id:old?old.id:uid(),site,cat:c||'기타',name:n,cycle,rule:r||'',stock:/^o$/i.test(st||'')})});
      const rts=[],bad2=[];$('#eRoutine').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{const [cy,...tx]=l.split('|').map(x=>x.trim());const cycle=CYC_BY_NAME[cy];if(!cycle||!tx.join('|')){bad2.push(i+1);return}const old=ROUTINE().find(x=>x.text===tx.join(' | '));rts.push({id:old?old.id:uid(),cycle,text:tx.join(' | ')})});
      if(bad.length||bad2.length){toast(`형식이 맞지 않는 줄: ${bad.length?'품목 '+bad.join(','):''} ${bad2.length?'정기 업무 '+bad2.join(','):''}`);return}
      S.org.items=its;S.org.routine=rts;save();closeModal();toast('저장했어요');break}
    case 'resetItems':S.org.items=DEFAULT_ITEMS();S.org.routine=DEFAULT_ROUTINE();save();closeModal();toast('인수인계서 기본값으로 되돌렸어요');break;
    case 'printMonth':exportDoc(monthDoc(),`물품구매내역_${repMonth}`);break;
    case 'printHandover':exportDoc(handoverDoc(),`물품구매_인수인계서_${today().replace(/-/g,'')}`);break;
    case 'backup':{const data=JSON.stringify({app:'maum-purchase',v:2,savedAt:new Date().toISOString(),org:S.org,members:S.members,requests:S.requests,orders:S.orders,surveys:S.surveys});const name=`물품구매관리_기록_${today().replace(/-/g,'')}.json`;
      if(window.AdminAndroid&&AdminAndroid.saveFile){AdminAndroid.saveFile(name,'application/json',data);break}
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();break}
    case 'notiPerm':if(window.AdminAndroid&&AdminAndroid.requestNotiPermission){AdminAndroid.requestNotiPermission();toast('알림 허용 창이 뜨면 ‘허용’을 눌러 주세요')}else toast('휴대폰 앱에서 쓸 수 있어요');break;
    case 'notiTest':if(window.AdminAndroid&&AdminAndroid.testNotification){AdminAndroid.testNotification('물품 구매 알림 시험','알림이 이렇게 떠요 ✅');toast('곧 시험 알림이 떠요')}else toast('휴대폰 앱에서 쓸 수 있어요');break;
    // 로그인 · 기관
    case 'signIn':case 'signUp':{const em=$('#aEmail').value.trim(),pw=$('#aPw').value;authMsg='';
      if(d.act==='signUp'&&pw!==$('#aPw2').value){authMsg='비밀번호 두 개가 달라요';render();return}
      t.disabled=true;try{if(d.act==='signUp'){await ST.signUp(em,pw);await ST.verify()}else await ST.signIn(em,pw)}catch(err){authMsg=errMsg(err);render()}break}
    case 'resetPw':{const em=$('#aEmail').value.trim();if(!em){authMsg='이메일을 먼저 적어 주세요';render();return}try{await ST.reset(em);toast('비밀번호 재설정 메일을 보냈어요')}catch(err){authMsg=errMsg(err);render()}break}
    case 'checkVerify':try{if(await ST.refresh()){AUTH.verified=true;startOrg()}else toast('아직 인증되지 않았어요 — 메일의 링크를 눌러 주세요')}catch(err){toast(errMsg(err))}break;
    case 'resendVerify':try{await ST.verify();toast('인증 메일을 다시 보냈어요')}catch(err){toast(errMsg(err))}break;
    case 'logout':if(UNSUB)UNSUB();UNSUB=null;ORG=null;ready=false;await ST.signOut();break;
    case 'leave':if(!confirmLeave()){break}if(UNSUB)UNSUB();UNSUB=null;ORG=null;ready=false;S={me:null,org:null,members:[],requests:[],orders:[],surveys:[]};await ST.leaveOrg();view='setup';render();break;
    case 'joinOrg':{const nm=$('#jName').value.trim(),cd=$('#jCode').value.trim();if(!nm||!cd){toast('이름과 참여 코드를 넣어 주세요');return}t.disabled=true;try{ORG=await ST.joinOrg(cd,nm);listenOrg()}catch(err){t.disabled=false;toast(errMsg(err))}break}
    case 'createOrg':{const on=$('#cOrg').value.trim(),nm=$('#cName').value.trim();if(!on||!nm){toast('기관 이름과 내 이름을 넣어 주세요');return}const roles=[...document.querySelectorAll('.cRole:checked')].map(x=>x.value);t.disabled=true;
      try{ORG=await ST.createOrg({orgName:on,myName:nm,roles,seed:{settings:DEFAULT_SETTINGS,items:DEFAULT_ITEMS(),routine:DEFAULT_ROUTINE(),checks:{},stock:{}}});listenOrg()}catch(err){t.disabled=false;toast(errMsg(err))}break}
  }
});
let _leaveArm=0;function confirmLeave(){if(Date.now()-_leaveArm<4000)return true;_leaveArm=Date.now();toast('한 번 더 누르면 이 휴대폰에서 기관 연결을 끊어요');return false}
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='repMonth'){repMonth=el.value;render();return}
  if(el.id==='rSv'){const s=S.surveys.find(x=>x.id===el.value);if(s&&s.site&&s.site!=='all')$('#fSite').value=s.site;return}
  if(el.dataset.myname!==undefined){const v=el.value.trim();if(!v)return;const {id,...m}=S.me;ST.put(ORG,'members',id,{...m,name:v}).then(()=>toast('이름을 바꿨어요')).catch(err=>toast(errMsg(err)));return}
  if(el.dataset.org){S.org.name=el.value.trim()||orgName();save();toast('저장했어요');return}
  if(el.dataset.st){const k=el.dataset.st;S.org.settings={...SET(),[k]:['approveItem','approveOrder'].includes(k)?Math.max(0,+el.value||0):el.value.trim()};save();if(k==='bizNo')render();toast('저장했어요');return}
  if(el.dataset.addr){const s=SET();s.addr[el.dataset.addr]=el.value.trim();S.org.settings=s;save();toast('저장했어요');return}
  if(el.dataset.noti){const k=el.dataset.noti,N=L.noti;N[k]=el.type==='checkbox'?el.checked:(['monthDay','weekDay'].includes(k)?+el.value:el.value);saveL();render();toast('알림 설정을 저장했어요');return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pkIn')pkCheck()});

/* ===================== 시작 ===================== */
function listenOrg(){if(UNSUB)UNSUB();ready=false;S={me:null,org:null,members:[],requests:[],orders:[],surveys:[]};BASE={};view='home';
  $('#app').innerHTML='<div class="empty" style="padding-top:40vh">기관 자료를 불러오는 중…</div>';
  UNSUB=ST.listen(ORG,onData,(err,key)=>{console.error(key,err);if(key==='me'||key==='org'){toast('기관 자료를 볼 권한이 없어요');}})}
async function startOrg(){
  try{const me=await ST.loadMe();if(me&&me.orgId){ORG=me.orgId;listenOrg()}else{view='setup';render()}}
  catch(err){toast(errMsg(err));view='setup';render()}
}
ST.onAuth(u=>{AUTH=u;if(UNSUB){UNSUB();UNSUB=null}ORG=null;ready=false;
  if(!u){view='auth';render();return}
  if(!u.verified){view='auth';render();return}
  startOrg();
});
window.nuBack=function(){if($('#modal').innerHTML){closeModal();return true}const T=tabs();if(ORG&&view!==T[0][0]){view=T[0][0];render();scrollTo(0,0);return true}return false};
window.__test={S:()=>S,buildReminders,myQueue,monthDoc,handoverDoc,bizValid,sha};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(payPending)onReturn();syncReminders()}});
</script>
</body></html>
